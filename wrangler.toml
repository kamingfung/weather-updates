name = "weather-updates"
main = "src/worker.js"
compatibility_date = "2026-08-10"
compatibility_flags = ["nodejs_compat"]

# Static site files are stored in KV — the Worker serves them directly.
# This ensures every request goes through the Worker (auth gate) with no
# CDN bypass. The ASSETS binding approach was unreliable because Cloudflare's
# asset CDN layer bypassed the Worker on cache HITs regardless of run_worker_first.
[[kv_namespaces]]
binding = "SITE_ASSETS"
id = "b157129a41e24e71a3c1dda388d53001"

# Secrets (never stored here — set via wrangler CLI or Cloudflare dashboard):
#   wrangler secret put BASIC_USER
#   wrangler secret put PASSWORD
